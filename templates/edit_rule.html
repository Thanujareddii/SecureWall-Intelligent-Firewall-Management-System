{% extends "base.html" %}
{% set title = "Edit Rule" %}
{% block content %}
<section class="login-panel">
    <div class="login-badge">Administrator Console</div>
    <h1>Edit Rule</h1>
    <form class="login-form" method="POST">
        <label>IP Address</label>
        <input type="text" name="ip" value="{{ rule[1] }}" required>
        <label>Action</label>
        <select name="action">
            <option value="ALLOW" {% if rule[2] == 'ALLOW' %}selected{% endif %}>ALLOW</option>
            <option value="BLOCK" {% if rule[2] == 'BLOCK' %}selected{% endif %}>BLOCK</option>
        </select>
        <label class="checkbox-line"><input type="checkbox" name="enabled" {% if rule[3] == 1 %}checked{% endif %}> Enabled</label>
        <button type="submit">Save</button>
    </form>
    <a class="text-link" href="{{ url_for('admin_dashboard') }}">← Back</a>
</section>
{% endblock %}
