{% extends "base.html" %}
{% set title = "SecureWall Traffic Testing" %}

{% block content %}
<section class="panel small-panel">
    <h1>Traffic Testing</h1>

    <form class="form-row" method="POST" action="{{ url_for('test') }}">
        <input type="text" name="ip" placeholder="Enter IP Address" required>
        <button type="submit">Check Traffic</button>
    </form>

    {% if result %}
        <div class="result-box {{ 'blocked-result' if result == 'BLOCK' else 'safe-result' }}">
            IP <strong>{{ scanned_ip }}</strong> is <strong>{{ result }}</strong>
        </div>
    {% endif %}
</section>
{% endblock %}
